# CNCF conformance runs. See README.md in this directory.

name: Conformance

on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        description: Product to test.
        options: [k0s, k0rdent, all]
        default: k0s
      suite:
        type: choice
        description: CNCF suite to run.
        options: [ai, k8s]
        default: ai
      version:
        type: string
        description: "main (build from main), stable, or a release tag."
        default: main
      suite-sha:
        type: string
        description: Override SUITE_SHA from versions.env (ai suite only).
        default: ""
      keep-cluster:
        type: boolean
        description: Keep the cluster after the run (for debugging).
        default: false
  schedule:
    - cron: 30 3 * * 1 # every Monday; runs suite=ai on main

permissions:
  contents: read
  actions: read # download the k0s-linux-amd64 artifact of the latest green k0s main build
  id-token: write # azure/login via OIDC

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      suite: ${{ steps.plan.outputs.suite }}
      version: ${{ steps.plan.outputs.version }}
      suite-sha: ${{ steps.plan.outputs.suite-sha }}
      keep-cluster: ${{ steps.plan.outputs.keep-cluster }}
      timeouts: ${{ steps.plan.outputs.timeouts }}
      attempts: ${{ steps.plan.outputs.attempts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: plan
        env:
          # Scheduled runs have no inputs; these are the cron defaults.
          PRODUCT: ${{ inputs.product || 'all' }}
          SUITE: ${{ inputs.suite || 'ai' }}
          VERSION: ${{ inputs.version || 'main' }}
          SUITE_SHA_INPUT: ${{ inputs.suite-sha }}
          KEEP: ${{ inputs.keep-cluster && 'y' || 'n' }}
        run: |
          case "$PRODUCT" in
            all) matrix='["k0s","k0rdent"]' ;;
            *) matrix="[\"$PRODUCT\"]" ;;
          esac
          # shellcheck disable=SC1091
          . ./versions.env
          {
            echo "matrix=$matrix"
            echo "suite=$SUITE"
            echo "version=$VERSION"
            echo "suite-sha=${SUITE_SHA_INPUT:-$SUITE_SHA}"
            echo "keep-cluster=$KEEP"
            # Scheduled runs retry once so a transient infrastructure failure does not
            # page anyone; dispatched runs do not, because their artifacts may be submitted.
            attempts=$([ "$GITHUB_EVENT_NAME" = schedule ] && echo 2 || echo 1)
            # Minutes per attempt and product. k0s ai ≈ 15 min, k0rdent ai ≈ 36 min
            # (kind + kcm 5, ClusterDeployment 10, GPU Operator 7, suite 3, teardown 8).
            if [ "$SUITE" = k8s ]; then k0s=180; k0rdent=180; else k0s=60; k0rdent=75; fi
            echo "attempts=$attempts"
            echo "timeouts={\"k0s\":$((k0s * attempts)),\"k0rdent\":$((k0rdent * attempts))}"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  run:
    name: "${{ matrix.product }} :: ${{ needs.plan.outputs.suite }} :: ${{ needs.plan.outputs.version }}"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeouts)[matrix.product] }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RUN_ID: ${{ github.run_id }} # provisioners add the product; k0rdent names cap its length
      ARTIFACTS: ${{ github.workspace }}/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
          cache: false

      - name: Install product tools
        run: provision/${{ matrix.product }}/provision.sh deps

      - name: Run
        env:
          # For version=main the k0s provisioner downloads k0s-linux-amd64 from the
          # latest green k0sproject/k0s main build with gh.
          GH_TOKEN: ${{ github.token }}
          # The k0rdent provisioner runs the Azure CAPI provider inside a kind cluster,
          # which authenticates with the service principal itself; the OIDC login above
          # only covers the az CLI.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PRODUCT: ${{ matrix.product }}
          SUITE: ${{ needs.plan.outputs.suite }}
          VERSION: ${{ needs.plan.outputs.version }}
          SUITE_SHA: ${{ needs.plan.outputs.suite-sha }}
          KEEP_CLUSTER: ${{ needs.plan.outputs.keep-cluster }}
          ATTEMPTS: ${{ needs.plan.outputs.attempts }}
        run: |
          keep=''
          [ "$KEEP_CLUSTER" != y ] || keep=--keep-cluster
          rc=1
          for attempt in $(seq 1 "$ATTEMPTS"); do
            run_id="$RUN_ID"
            [ "$attempt" -eq 1 ] || run_id="$RUN_ID-r$attempt"
            # shellcheck disable=SC2086
            ./run.sh --product "$PRODUCT" --suite "$SUITE" --version "$VERSION" \
              --suite-sha "$SUITE_SHA" --run-id "$run_id" --out "$ARTIFACTS" $keep 2>&1 | tee "run-$attempt.log"
            rc="${PIPESTATUS[0]}"
            {
              echo "### attempt $attempt of $ATTEMPTS: exit $rc"
              echo '```'
              tail -n 8 "run-$attempt.log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            [ "$rc" -ne 0 ] || break
            [ "$attempt" -eq "$ATTEMPTS" ] || echo "::warning::attempt $attempt failed with exit $rc; retrying"
          done
          exit "$rc"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.product }}-${{ needs.plan.outputs.suite }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACTS }}
            !${{ env.ARTIFACTS }}/**/kubeconfig
            !${{ env.ARTIFACTS }}/**/ssh/**
          if-no-files-found: warn
          retention-days: 90

      - name: Destroy leftovers
        # Safety net in case the runner killed run.sh before its own cleanup.
        if: always() && needs.plan.outputs.keep-cluster != 'y'
        env:
          ATTEMPTS: ${{ needs.plan.outputs.attempts }}
        run: |
          for attempt in $(seq 1 "$ATTEMPTS"); do
            run_id="$RUN_ID"
            [ "$attempt" -eq 1 ] || run_id="$RUN_ID-r$attempt"
            provision/${{ matrix.product }}/provision.sh down --run-id "$run_id"
          done
